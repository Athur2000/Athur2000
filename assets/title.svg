<svg width="900" height="300" viewBox="0 0 900 300"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Gradiente principal -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>

    <!-- Gradiente do texto -->
    <linearGradient id="textGradient"
                    x1="0%" y1="0%"
                    x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F7FF"/>
      <stop offset="50%" stop-color="#6C63FF"/>
      <stop offset="100%" stop-color="#FF00FF"/>
    </linearGradient>

    <!-- Brilho -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- Fundo -->
  <rect width="900" height="300" fill="url(https://i.pinimg.com/736x/01/c7/da/01c7dacab25df0d6e9f038bdc6577419.jpg)"/>

  <!-- Nome -->
  <text x="450" y="135"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="52"
        font-weight="700"
        fill="url(#textGradient)"
        filter="url(#glow)">
   Arthur Rodrigues
  </text>

  <!-- Subtítulo -->
  <text x="450" y="180"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="21"
        fill="#FFFFFF"
        opacity="0.85">
    Software Engineering Student
  </text>

  <!-- Linha -->
  <line x1="280" y1="205"
        x2="620" y2="205"
        stroke="#00F7FF"
        stroke-opacity="0.5"
        stroke-width="2"/>

  <!-- Rodapé -->
  <text x="450" y="245"
        text-anchor="middle"
        font-family="monospace"
        font-size="15"
        fill="#00F7FF"
        opacity="0.8">
    C • Python • PHP • Algorithms
  </text>

</svg>
